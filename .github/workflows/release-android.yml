# Builds a signed release APK and attaches it to a GitHub Release whenever a
# version tag is pushed:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of android/upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_PASSWORD      key password
#   ANDROID_KEY_ALIAS         key alias (upload)
# Optional (enables cloud sync in the build; without them the app runs fully
# local, see CloudConfig.isConfigured):
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY

name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc.
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Write cloud config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p config
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" \
              '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key}' > config/supabase.release.json
          else
            echo "Supabase secrets not set; building a local-only APK."
            echo '{}' > config/supabase.release.json
          fi

      - run: flutter pub get

      - name: Validate app version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          # DAFTARY_APP_VERSION gates the server's savings-conflict policy
          # (migration 025); anything but a plain x.y.z would silently fall
          # back to last-write-wins.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::App version '$VERSION' (from '$GITHUB_REF_NAME') is empty or not x.y.z; refusing to build."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          # 023 (T124, CHK013): the Gradle switch merges the READ_SMS-only
          # overlay (android/app/sms_capability/AndroidManifest.xml); it is
          # the only place the capability is decided. Off unless the repo
          # variable DAFTARY_SMS_IMPORT_RELEASE is "true", which the owner
          # sets only after clearing gates OQ5 (Play Protect, Egypt) and
          # OQ6 (restricted settings) on devices (T160). Off still ships
          # paste and share.
          DAFTARY_SMS_IMPORT: ${{ vars.DAFTARY_SMS_IMPORT_RELEASE == 'true' && 'true' || 'false' }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=DAFTARY_APP_VERSION="$VERSION" \
            --dart-define-from-file=config/supabase.release.json
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Daftary-$VERSION-universal.apk"
          # Smaller per-ABI build; arm64 covers practically every phone from
          # the last several years and is the recommended download.
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=DAFTARY_APP_VERSION="$VERSION" \
            --dart-define-from-file=config/supabase.release.json
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Daftary-$VERSION-arm64.apk"

      # 023 (T124, FR-008a, FR-073): check what actually shipped. Every APK
      # declares READ_SMS exactly when the switch is on, never RECEIVE_SMS,
      # SEND_SMS or READ_PHONE_STATE (nor the other SMS/MMS permissions),
      # and keeps the ACTION_SEND share filter on ShareTargetActivity.
      - name: Verify APK permissions
        env:
          DAFTARY_SMS_IMPORT: ${{ vars.DAFTARY_SMS_IMPORT_RELEASE == 'true' && 'true' || 'false' }}
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          AAPT="${BUILD_TOOLS}aapt"
          if [ ! -x "$AAPT" ]; then
            echo "::error::aapt not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          status=0
          for apk in dist/*.apk; do
            echo "== $apk"
            perms="$("$AAPT" dump permissions "$apk")"
            echo "$perms" | grep -i "permission" || true
            if echo "$perms" | grep -q "name='android.permission.READ_SMS'"; then
              has_read_sms=true
            else
              has_read_sms=false
            fi
            if [ "$has_read_sms" != "$DAFTARY_SMS_IMPORT" ]; then
              echo "::error::$apk READ_SMS declared=$has_read_sms, expected $DAFTARY_SMS_IMPORT"
              status=1
            fi
            for forbidden in RECEIVE_SMS SEND_SMS READ_PHONE_STATE RECEIVE_MMS RECEIVE_WAP_PUSH WRITE_SMS; do
              if echo "$perms" | grep -q "name='android.permission.$forbidden'"; then
                echo "::error::$apk declares $forbidden"
                status=1
              fi
            done
            # The component that owns each android.intent.action.SEND
            # action, read from the compiled manifest.
            send_owners="$("$AAPT" dump xmltree "$apk" AndroidManifest.xml | awk '
              /E: (activity|activity-alias|receiver|service|provider) / { want = 1; next }
              want && /A: android:name\(/ {
                match($0, /="[^"]*"/); owner = substr($0, RSTART + 2, RLENGTH - 3); want = 0; next
              }
              /A: android:name\(/ && /"android.intent.action.SEND"/ { print owner }
            ')"
            if [ "$send_owners" != "com.daftary.daftary.ShareTargetActivity" ]; then
              echo "::error::$apk: ACTION_SEND filter owners are '$send_owners', expected ShareTargetActivity only"
              status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: daftary-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Install on Android
            1. Download **Daftary-…-arm64.apk** from the assets below (works on almost every modern phone).
               If it won't install, use **Daftary-…-universal.apk** instead.
            2. Open it on your phone and allow "Install unknown apps" when asked.

            iPhone: join the TestFlight beta (link in the README).
