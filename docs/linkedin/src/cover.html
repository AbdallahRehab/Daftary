<!doctype html><html><head><meta charset="utf-8"><title>Daftary Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:627px;overflow:hidden;font-family:"Plus Jakarta Sans",sans-serif;color:#fff;
background:radial-gradient(120% 120% at 0% 0%,#2A8A6C 0%,#134A3C 50%,#0E3B30 100%);position:relative}
.l{position:absolute;left:70px;top:80px;width:560px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:76px;height:76px;border-radius:20px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.name{font-size:36px;font-weight:800}.name span{font-family:"IBM Plex Sans Arabic";color:#F2B53A}
h1{font-size:54px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-top:44px}
h1 em{font-style:normal;color:#F2B53A}
p{font-size:21px;line-height:1.45;color:rgba(255,255,255,.75);margin-top:20px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.chip{font-size:16px;font-weight:700;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
.phone{position:absolute;border-radius:40px;padding:9px;background:#0B1512;box-shadow:0 30px 60px -15px rgba(0,0,0,.55),0 0 0 2px #2b3a35 inset}
.phone .s{border-radius:32px;overflow:hidden;aspect-ratio:644/1400;position:relative;background:#F4FBF5}
.phone img{width:100%;display:block}
.sb{position:absolute;left:0;right:0;top:0;height:6.4%;background:#F4FBF5;display:flex;align-items:center;padding:5% 10% 0;font-weight:700;font-size:12px;color:#10231D}
</style></head><body>
<div class="l">
 <div class="brand"><img src="../../../assets/icon/icon.png"><div class="name">Daftary <span>· دفتري</span></div></div>
 <h1>Who owes you, and who you owe. <em>One notebook.</em></h1>
 <p>People-first personal finance for Arabic-speaking users.</p>
 <div class="chips"><span class="chip">Flutter</span><span class="chip">Clean Architecture</span><span class="chip">BLoC</span><span class="chip">Drift</span><span class="chip">Supabase</span></div>
</div>
<div class="phone" style="left:700px;top:120px;width:230px;transform:rotate(-7deg)"><div class="s"><img src="../../screenshots/ar_person_detail.png"><div class="sb">9:41</div></div></div>
<div class="phone" style="left:900px;top:60px;width:250px"><div class="s"><img src="../../screenshots/en_home_dark.png"></div></div>
</body></html>
