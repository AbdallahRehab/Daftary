# Static analysis and unit / widget / bloc tests on every push and pull
# request to main. Integration tests need a device and aren't run here.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with .fvmrc.
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter=github

      # 022 B1: sync date mapping must be correct whatever the machine time
      # zone; these suites are re-run in UTC so a regression can't hide behind
      # a developer's local zone.
      - name: Test sync in UTC
        env:
          TZ: UTC
        run: flutter test --reporter=github test/core/sync test/features/transactions/data/sync test/features/finance/data/sync
