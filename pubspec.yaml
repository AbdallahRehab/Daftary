name: daftary
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.0
  # Held at the 2.x line (not ^3.0.0) because fl_chart (010) still
  # depends on equatable ^2.0.7 and uses `EquatableMixin`, which 3.0 removed.
  # Every Equatable class in this app uses `extends Equatable`, which 2.1
  # supports identically.
  equatable: ^2.1.0
  get_it: ^9.3.0
  injectable: ^3.0.0
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0
  fpdart: ^1.1.1
  uuid: ^4.5.1
  intl: ^0.20.2
  go_router: ^18.0.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  app_settings: ^9.0.0
  # 020: optional Liquid Glass UI. Capped below 1.8 because 1.x minors
  # have changed rendering defaults (research.md Decision 1).
  liquid_glass_widgets: '>=1.7.2 <1.8.0'
  # 021: cloud auth (anonymous + email one-time code), sync RPCs, token refresh.
  supabase_flutter: ^2.17.2
  # 021: network-change hint that triggers a sync attempt (never a gate).
  connectivity_plus: ^7.3.1
  # 021: secure storage for the cloud session (constitution XII).
  flutter_secure_storage: ^11.2.0
  # 021: already resolved through supabase_flutter; named directly because
  # the sync error mapper classifies its `ClientException` as a network
  # failure (research.md Decision 20).
  http: ^1.6.0

  # FR-017: camera/gallery capture for occasion photo attachments. Wrapped
  # behind `core/media/AttachmentPickerService` so the upcoming OCR feature
  # can reuse the same capture flow (research.md Decision 7).
  image_picker: ^1.1.2

  # 009 OCR: on-device text recognition (Google ML Kit, Latin script model).
  # Runs entirely on-device with zero network calls (FR-019, research.md
  # Decision 1).
  google_mlkit_text_recognition: ^0.17.1
  # 009 OCR: native crop/rotate UI for the pre-OCR preparation step
  # (FR-002, research.md Decision 2).
  image_cropper: ^9.0.0
  # 009 OCR: pure-Dart image processing, used only for the deterministic
  # brightness/contrast linear-stretch enhancement pass (research.md
  # Decision 2) — no ML-based "smart" enhancement.
  image: ^4.3.0

  # 010 Budgets: grouped planned-vs-actual bar chart for the spending trend
  # view (FR-014, research.md Decision 4).
  fl_chart: ^1.2.0

  # 013 Data export: hands the generated CSV to the OS share sheet (FR-010).
  # Wrapped behind `data_privacy/ShareService`; only SharePlusService imports it.
  share_plus: ^13.3.0

  # 014 AI assistant also keeps the user's provider API key in
  # flutter_secure_storage (above), wrapped behind
  # `ai_assistant/SecureCredentialStore` — never in drift.
  # 015 App Lock: OS biometric prompt (research.md Decision 1/FR-005).
  # Wrapped behind `app_lock/BiometricService`; only
  # LocalAuthBiometricService imports it.
  local_auth: ^3.0.2
  # 015 App Lock: HMAC-SHA256 for PBKDF2 PIN hashing (research.md
  # Decision 7). Used only by `app_lock/PinHasher`.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  injectable_generator: ^3.1.3
  # Used directly by the v4 -> v5 migration test, which builds a
  # schemaVersion-4 database through a raw sqlite3 handle so drift actually
  # runs onUpgrade against it. Already present transitively via drift; named
  # here because the test imports it.
  sqlite3: ^3.6.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  # 021: drives the sync scheduler's timers (debounce, periodic, backoff)
  # without waiting in real time; 015: AppLifecycleObserver's inactivity
  # timer. Already resolved via flutter_test.
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 016 Financial Education: bundled, offline, per-language content
  # (research.md Decision 1). Directory entries are not recursive, so each
  # `articles/` folder is listed explicitly.
  assets:
    - lib/features/financial_education/data/content/en/
    - lib/features/financial_education/data/content/en/articles/
    - lib/features/financial_education/data/content/ar/
    - lib/features/financial_education/data/content/ar/articles/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
